# Model A: trained on the clean-background render of the paired dataset.
name: distracting_reacher
args: []
kwargs:
  difficulty: easy
  img_size: ${img_size}
  action_repeat: 2
  bg_enabled: false        # eval conditions override this via set_env_attr
  bg_source: davis
  bg_split: train
  ground_plane_alpha: 0.0

dataset:
  _target_: "datasets.distracting_reacher_dset.load_distracting_reacher_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/distracting_reacher/clean
  split_ratio: 0.9
  use_cached_features: false
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16
