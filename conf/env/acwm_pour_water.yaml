name: acwm_pour_water
args: []
kwargs: {}

load_dir: ""

dataset:
  _target_: "datasets.acwm_pour_water_dset.load_acwm_pour_water_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/acwm_phys/particle/pour_water
  exclude: [60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79] # ind_train episodes without a pour (scattered water)
  split_ratio: 0.9
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 8
