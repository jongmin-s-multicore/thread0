name: acwm_push_sand
args: []
kwargs: {}

load_dir: ""

dataset:
  _target_: "datasets.acwm_phys_dset.load_acwm_phys_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/acwm_phys/particle/push_sand
  exclude: []
  action_format: pose_next # pusher pose of the next frame as (x, z, cos yaw, sin yaw)
  action_dims: null
  split_ratio: 0.9
  transform:
    _target_: "datasets.acwm_phys_dset.resize_transform" # 304x512 frames, resized without cropping
    img_size: ${img_size}

decoder_path: null
num_workers: 12
