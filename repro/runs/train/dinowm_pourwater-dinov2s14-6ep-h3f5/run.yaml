# 이 실행이 무엇이었는지의 단일 출처 (repro/make_run_yaml.py 로 생성). 결과 수치는 넣지 않는다 — 이슈로 올린다.
id: dinowm_pourwater-dinov2s14-6ep-h3f5
kind: train
stack: dinowm
job: train_pw_h3f5
date: 2026-10-08
env: acwm_pour_water
dataset: >-
  $DATASET_DIR/acwm_phys/particle/pour_water (HF t1an/ACWM-Phys 4017e5f). ind_train 1000개에서
  episode_60–79 20개(물이 흩어져 붓는 장면이 없다)를 빼고 980개를 무작위 0.9/0.1 seed 42 로 나눠 학습 882 / 검증 98 에피소드, 에피소드마다
  300프레임
model:
  encoder: 'DINOv2 ViT-S/14 patch tokens, 동결 (hub 85a2460)'
  predictor: 'ViT depth 6, heads 16, mlp 2048, dropout 0.1'
  decoder: 'VQ-VAE decoder (quantize False), 같은 학습 안에서 따로 최적화: 정답 프레임 잠재(detach)를 재구성하는 MSE 만 학습'
  num_hist: 3
  num_pred: 1
  frameskip: 5
  img_size: 224
training:
  epochs: 6
  batch_size: 24
  optimizer: 'predictor·action encoder AdamW, decoder Adam'
  lr: >-
    decoder 3e-4, predictor 5e-5, action encoder 5e-4 (predictor 를 바꿨다 — upstream 5e-4, 논문 Table 12 는
    predictor 5e-5)
  seed: 0
  save_every_x_epoch: 1
  batch_note: 논문은 32. num_hist 3 은 24 GB GPU 에서 32 가 OOM 이라 24 (LOCAL.md §2·§3)
command: >-
  bash repro/queue/run_train.sh train_pw_h3f5 <gpu> env=acwm_pour_water frameskip=5 num_hist=3
  training.epochs=6 training.save_every_x_epoch=1 training.predictor_lr=5e-5 training.batch_size=24
output: >-
  $DINO_TRAIN/outputs/train_pw_h3f5/ (hydra.yaml, checkpoints/model_<epoch>.pth, epoch_logs.jsonl)
code: >-
  hanbin5/water 41606dc (run_info.txt 의 branch=hanbin5/local 은 옮기기 전 이름). 코드: upstream
  gaoyuezhou/dino_wm 0a9492f + main 공용 수정 + 이 브랜치의 24 GB 수정 (git diff 0a9492f -- . ':!repro' ':!*.md'
  ':!.gitignore')
