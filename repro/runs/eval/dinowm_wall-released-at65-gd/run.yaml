# 이 실행이 무엇이었는지의 단일 출처 (repro/make_run_yaml.py 로 생성). 결과 수치는 넣지 않는다 — 이슈로 올린다.
id: dinowm_wall-released-at65-gd
kind: eval
stack: dinowm
job: wall_gd
date: '-'
env: wall
model:
  source: 공개 체크포인트 (OSF checkpoints/outputs.zip)
  ckpt: $DINO_CKPT/outputs/wall_single/checkpoints/model_latest.pth
  epoch: 65
  num_hist: 1
  frameskip: 5
planner:
  name: 오픈루프 GD (conf/planner/gd.yaml)
  gd: 'horizon = goal_H 5, SGD lr 1, 1000 steps, action_noise 0.003, randn 초기화'
  eval_every: 10
protocol:
  n_evals: 50
  goal_source: random_state
  goal_H: 5
  objective: '마지막 프레임 latent MSE, alpha 1'
  seed: 99
command: >-
  bash repro/queue/run_plan.sh wall_gd <gpu> --config-name plan.yaml model_name=wall_single planner=gd
  goal_source=random_state goal_H=5 n_evals=50 objective.alpha=1
runner_env: >-
  DINO_WM_SDPA=1 DINO_WM_SKIP_SOLVED=1 (run_plan.sh 기본값). 롤아웃·GD 청크는 메모리 조정이라 결과와 무관하고 머신마다 준다
code: '이 레포: gaoyuezhou/dino_wm 0a9492f + 재현 커밋 (git diff 0a9492f -- . '':!repro'')'
output: $DINO_RUNS/wall_gd/
results: logs.json 의 final_eval/success_rate
