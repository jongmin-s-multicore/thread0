# 이 실행이 무엇이었는지의 단일 출처 (repro/make_run_yaml.py 로 생성). 결과 수치는 넣지 않는다 — 이슈로 올린다.
id: dinowm_pusht-released-at2-gd
kind: eval
stack: dinowm
job: pusht_gd
date: 2026-10-01
env: pusht
model:
  source: 공개 체크포인트 (OSF checkpoints/outputs.zip)
  ckpt: $DINO_CKPT/outputs/pusht/checkpoints/model_latest.pth
  epoch: 2
  num_hist: 3
  frameskip: 5
planner:
  name: 오픈루프 GD (conf/planner/gd.yaml)
  gd: 'horizon = goal_H 5, SGD lr 1, 1000 steps, action_noise 0.003, randn 초기화'
  eval_every: 10
protocol:
  n_evals: 50
  goal_source: dset
  goal_H: 5
  objective: '마지막 프레임 latent MSE, alpha 1'
  seed: 99
command: >-
  bash repro/queue/run_plan.sh pusht_gd <gpu> --config-name plan.yaml model_name=pusht planner=gd
  goal_source=dset goal_H=5 n_evals=50 objective.alpha=1
runner_env: >-
  DINO_WM_GD_CHUNK=8 DINO_WM_ROLLOUT_CHUNK=150 DINO_WM_SDPA=1 DINO_WM_SKIP_SOLVED=1 (run_info.txt; 청크는
  합산 순서만 바꾼다, LOCAL.md §2)
code: >-
  fork 이전 upstream clone 0a9492f 에 같은 diff 를 커밋 없이 패치 (DINOv2 hub 캐시 85a2460). 코드: upstream
  gaoyuezhou/dino_wm 0a9492f + main 공용 수정 + 이 브랜치의 24 GB 수정 (git diff 0a9492f -- . ':!repro' ':!*.md'
  ':!.gitignore')
output: $DINO_RUNS/pusht_gd/
results: logs.json 의 final_eval/success_rate
