# 이 실행이 무엇이었는지의 단일 출처 (repro/make_run_yaml.py 로 생성). 결과 수치는 넣지 않는다 — 이슈로 올린다.
id: dinowm_rope-dinov2s14-100ep-at100-mpccem-armvideo
kind: eval
stack: dinowm
job: rope_mpc_arm
date: 2026-10-03
env: rope
model:
  source: 직접 학습 runs/train/dinowm_rope-dinov2s14-100ep
  ckpt: $DINO_TRAIN/outputs/train_rope/checkpoints/model_latest.pth
  epoch: 100
  num_hist: 1
  frameskip: 1
planner:
  name: MPC-CEM (conf/planner/mpc_cem.yaml)
  cem: 'horizon = goal_H 5, samples 300, topk 30, var_scale 1, opt_steps 30'
  n_taken_actions: goal_H 5
  max_iter: '5 (원본 null = 무제한; deformable 은 success 가 항상 False)'
  eval_every: 1000 (내부 CEM 시뮬 평가는 첫 opt step 뒤 한 번만)
protocol:
  n_evals: 10
  goal_source: random_state
  goal_H: 5
  objective: '마지막 프레임 latent MSE, alpha 1 (plan.yaml 기본값)'
  seed: 99
command: >-
  python repro/eval/deform_arm_video.py $DINO_RUNS/rope_mpc_arm --config-name plan.yaml
  model_name=train_rope planner=mpc_cem planner.max_iter=5 planner.sub_planner.eval_every=1000
  n_evals=10 goal_source=random_state goal_H=5 ckpt_base_path=$DINO_TRAIN
runner_env: >-
  DINO_WM_GD_CHUNK=8 DINO_WM_ROLLOUT_CHUNK=150 DINO_WM_SDPA=1 DINO_WM_SKIP_SOLVED=1 (run_info.txt; 청크는
  합산 순서만 바꾼다, LOCAL.md §2)
code: >-
  hanbin5/local a482f6e. 코드: upstream gaoyuezhou/dino_wm 0a9492f + main 공용 수정 + 이 브랜치의 24 GB 수정 (git
  diff 0a9492f -- . ':!repro' ':!*.md' ':!.gitignore'). 도구: repro/eval/deform_arm_video.py (실행할 때는 커밋
  전 main 작업 트리의 파일, 같은 동작으로 main 5180303 에 커밋)
output: $DINO_RUNS/rope_mpc_arm/
results: >-
  logs.json 의 mpc/mean_chamfer_distance (반복별), final_eval/mean_chamfer_distance.
  arm_video/{plan<i>,output_final}_<idx>_<tag>.mp4 = 팔이 움직이는 평가 영상, diag_actions.pkl = 실행한 행동
job_env: 'CKPT_BASE=$DINO_TRAIN (jobs/benchmark.txt)'
