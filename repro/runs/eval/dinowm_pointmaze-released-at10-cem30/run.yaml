# 이 실행이 무엇이었는지의 단일 출처 (repro/make_run_yaml.py 로 생성). 결과 수치는 넣지 않는다 — 이슈로 올린다.
id: dinowm_pointmaze-released-at10-cem30
kind: eval
stack: dinowm
job: pointmaze_cem30
date: 2026-10-01
env: point_maze
model:
  source: 공개 체크포인트 (OSF checkpoints/outputs.zip)
  ckpt: $DINO_CKPT/outputs/point_maze/checkpoints/model_latest.pth
  epoch: 10
  num_hist: 3
  frameskip: 5
planner:
  name: 오픈루프 CEM (conf/planner/cem.yaml)
  cem: 'horizon = goal_H 5, samples 300, topk 30, var_scale 1, opt_steps 30'
  eval_every: 1
protocol:
  n_evals: 50
  goal_source: random_state
  goal_H: 5
  objective: '마지막 프레임 latent MSE, alpha 0'
  seed: 99
command: >-
  bash repro/queue/run_plan.sh pointmaze_cem30 <gpu> --config-name plan.yaml model_name=point_maze
  planner=cem goal_source=random_state goal_H=5 n_evals=50 objective.alpha=0
runner_env: >-
  DINO_WM_GD_CHUNK=8 DINO_WM_ROLLOUT_CHUNK=150 DINO_WM_SDPA=1 DINO_WM_SKIP_SOLVED=1 (run_info.txt; 청크는
  합산 순서만 바꾼다, LOCAL.md §2)
code: >-
  hanbin5/local 798234f. 코드: upstream gaoyuezhou/dino_wm 0a9492f + main 공용 수정 + 이 브랜치의 24 GB 수정 (git
  diff 0a9492f -- . ':!repro' ':!*.md' ':!.gitignore')
output: $DINO_RUNS/pointmaze_cem30/
results: logs.json 의 final_eval/success_rate
